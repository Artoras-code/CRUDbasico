
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Biblioteca</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1120;
            --surface: #151e30;
            --border: #29354b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #6366f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(
                    ellipse at 80% 10%,
                    #242350 0%,
                    transparent 50%
                ),
                var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px #00000040;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            font-size: 2rem;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 1.8rem;
        }

        .subtitle {
            margin: 12px 0 32px;
            text-align: center;
            color: var(--muted);
            line-height: 1.6;
            font-size: 0.9rem;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f8fafc;
            font: inherit;
        }

        input:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px #6366f130;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #4f46e5;
        }

        .error {
            margin-bottom: 24px;
            padding: 14px;
            border: 1px solid #7f1d1d;
            border-radius: 10px;
            background: #450a0a;
            color: #fca5a5;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #64748b;
            font-size: 0.78rem;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="login-card">

        <div class="logo">📚</div>

        <h1>Biblioteca</h1>

        <p class="subtitle">
            Bienvenido al sistema de gestión de libros.
            Ingresa tus credenciales para continuar.
        </p>

        {% if form.errors %}
            <div class="error" role="alert">
                Usuario o contraseña incorrectos.
                Inténtalo nuevamente.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <input type="hidden"
                   name="next"
                   value="{{ next }}">

            <div class="field">
                <label for="id_username">Usuario</label>
                {{ form.username }}
            </div>

            <div class="field">
                <label for="id_password">Contraseña</label>
                {{ form.password }}
            </div>

            <button class="login-btn" type="submit">
                Iniciar sesión
            </button>
        </form>

        <div class="footer">
            Biblioteca · Desarrollo Seguro · Evaluación 3
        </div>

    </main>
</body>
</html>
