
# Proyecto existente en SonarQube
sonar.projectKey=CRUDbasico
sonar.projectName=CRUDbasico
sonar.projectVersion=3.0

# Servidor local
sonar.host.url=http://localhost:9000

# Código fuente
sonar.sources=config,libros

# Archivos excluidos del análisis
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/static/**,**/tests.py,**/tests/**

# Codificación
sonar.sourceEncoding=UTF-8

sonar.python.coverage.reportPaths=coverage.xml