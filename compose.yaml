
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crudbasico-web

    restart: "no"

    env_file:
      - .env

    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - django_data:/app/data

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:
  django_data:
